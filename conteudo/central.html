<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Radar UOL Esporte</title>
<style>
:root{--bg:#f2f1ee;--cd:#fff;--tx:#14171f;--mt:#5d6675;--ln:#e3e1dc;--ac:#1a2233;--au:#b4820a;--al:#c0392b;--ok:#1b7f4b;--az:#2563a8;--dt:#8a8578}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--cd:#171a21;--tx:#eef0f3;--mt:#9aa1ad;--ln:#2a2f39;--ac:#eef0f3;--au:#e0a92b;--al:#ff6b5e;--ok:#4cc38a;--az:#6ea8e6;--dt:#6c7482}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;padding:16px}
.capa{max-width:880px;margin:0 auto}
header{border-bottom:2px solid var(--ac);padding-bottom:10px}
.selo{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--au);font-weight:700}
h1{font-size:1.7rem;margin:2px 0;letter-spacing:-.01em}
.linha{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.quando{color:var(--mt);font-size:.8rem}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
nav a{font-size:.82rem;color:var(--mt);text-decoration:none;border:1px solid var(--ln);border-radius:20px;padding:4px 12px}
nav a:hover{color:var(--tx);border-color:var(--mt)}
nav a.botao{color:#fff;background:var(--au);border-color:var(--au);font-weight:600}
@media (prefers-color-scheme:dark){nav a.botao{color:#10151e}}
h2.parte{font-size:1.3rem;margin:26px 0 2px;border-bottom:2px solid var(--au);padding-bottom:6px}
.psub{color:var(--mt);font-size:.85rem;margin:4px 0 14px}
.diahead{font-size:.95rem;font-weight:700;color:var(--au);text-transform:uppercase;letter-spacing:.04em;margin:20px 0 8px}
.placar{background:var(--cd);border:1px solid var(--au);border-left:4px solid var(--au);border-radius:8px;padding:10px 14px;font-size:.92rem;margin-bottom:12px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;margin:10px 0}
.card.alta{border-left:4px solid var(--al)}.card.media{border-left:4px solid var(--au)}.card.baixa{opacity:.82}
.badge{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 7px;margin-right:7px;border:1px solid}
.b-ok{color:var(--ok);border-color:var(--ok)}.b-az{color:var(--az);border-color:var(--az)}.b-al{color:var(--al);border-color:var(--al)}.b-au{color:var(--au);border-color:var(--au)}.b-mt{color:var(--mt);border-color:var(--ln)}
.card h3{font-size:1.08rem;margin:8px 0 3px;line-height:1.25}
.card .resumo{color:var(--mt);font-size:.92rem;margin:0 0 8px}
.rot{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mt);margin:8px 0 4px;font-weight:600}
.linhas a,.linhas span{display:block;font-size:.88rem;padding:3px 0;border-top:1px solid var(--ln);color:var(--tx);text-decoration:none}
.linhas a:hover{color:var(--mt)}.linhas .v{color:var(--au);font-weight:700;font-size:.72rem;text-transform:uppercase;margin-right:6px}
.uol.sim a{color:var(--ok);text-decoration:none;font-weight:600}
.uol.nao{color:var(--al);font-size:.86rem}
.apurar{margin:6px 0 0;padding-left:18px}.apurar li{font-size:.9rem;margin-bottom:3px}
.coment{font-size:.88rem;color:var(--mt);font-style:italic;margin-top:6px}
.th{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mt);border-bottom:1px solid var(--ln);padding-bottom:6px;margin:22px 0 10px}
.live{display:flex;gap:8px;flex-wrap:wrap}.live .t{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:4px 11px;font-size:.82rem}.live .t .v{color:var(--dt)}
.aviso{background:var(--cd);border:1px solid var(--al);color:var(--al);border-radius:10px;padding:12px 14px;font-size:.9rem}
.nota{color:var(--dt);font-size:.77rem;margin-top:12px}
.rodape{color:var(--mt);font-size:.78rem;margin-top:28px;border-top:1px solid var(--ln);padding-top:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sair{color:var(--mt);font-size:.82rem;background:none;border:0;cursor:pointer;text-decoration:underline;padding:0}
</style></head><body>
<div class="capa">
<header>
  <div class="selo" id="selo"></div>
  <div class="linha"><h1>Radar UOL Esporte</h1><div class="quando" id="quando"></div></div>
</header>
<nav id="nav"></nav>
<div id="corpo"></div>
<p class="rodape"><span id="resumo"></span> <button class="sair" id="sair">Sair deste aparelho</button></p>
</div>
<script>
(function(){
var KS="central-chave-sessao";
function bin(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var raw=null;try{raw=sessionStorage.getItem(KS)}catch(e){}
if(!raw){document.getElementById("corpo").innerHTML='<div class="aviso">Sessão expirou. Recarregue e entre de novo.</div>';return}

function abrir(nome){
  return fetch(nome,{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(pct){
    if(!pct)return null;
    return crypto.subtle.importKey("raw",bin(raw),"AES-GCM",false,["decrypt"]).then(function(k){
      return crypto.subtle.decrypt({name:"AES-GCM",iv:bin(pct.iv)},k,bin(pct.dados))
    }).then(function(buf){return JSON.parse(new TextDecoder().decode(buf))})
  }).catch(function(){return null})
}
Promise.all([abrir("editorial.json"),abrir("tendencias.json")]).then(function(r){montar(r[0],r[1])})
  .catch(function(e){document.getElementById("corpo").innerHTML='<div class="aviso">Não consegui abrir os dados: '+esc(e.message)+'</div>'});

function dataBR(iso){if(!iso)return"";var p=String(iso).slice(0,10).split("-");return p.length===3?p[2]+"/"+p[1]:iso}
function diaSemana(iso){var dt=new Date(iso+"T12:00:00-03:00");if(isNaN(dt))return"";var s=dt.toLocaleDateString("pt-BR",{weekday:"long",timeZone:"America/Sao_Paulo"});return s.charAt(0).toUpperCase()+s.slice(1)}
function quandoBR(iso){if(!iso)return"";var dt=new Date(iso);if(isNaN(dt))return iso;return dt.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",timeZone:"America/Sao_Paulo"})}

function concorrenciaLinhas(arr){
  if(!arr||!arr.length)return"";
  return '<div class="rot">A concorrência deu</div><div class="linhas">'+arr.map(function(c){
    var txt=(c.oque?esc(c.oque):esc(c.titulo||"matéria"));
    return c.url?'<a href="'+esc(c.url)+'" target="_blank" rel="noopener"><span class="v">'+esc(c.veiculo)+'</span>'+txt+'</a>':'<span><span class="v">'+esc(c.veiculo)+'</span>'+txt+'</span>'
  }).join("")+'</div>';
}
function uolLinha(deu,url){
  if(deu&&url)return '<div class="rot">UOL</div><div class="uol sim"><a href="'+esc(url)+'" target="_blank" rel="noopener">UOL já deu — ver matéria ↗</a></div>';
  return '<div class="rot">UOL</div><div class="uol nao">Não localizado no UOL — conferir</div>';
}
function badgePrio(p){var k=p==="alta"?"b-al":p==="media"?"b-au":"b-mt";return '<span class="badge '+k+'">'+esc(p||"baixa")+'</span>'}
function badgeVer(v){var k=/lider/i.test(v)?"b-ok":/linha/i.test(v)?"b-az":/atr/i.test(v)?"b-al":"b-au";return '<span class="badge '+k+'">'+esc(v)+'</span>'}

function cardCorrer(x,nome){
  var compacto=(x.prioridade==="baixa");
  var h='<div class="card '+esc(x.prioridade||"baixa")+'">'+badgePrio(x.prioridade)+'<b>'+esc(nome||x.tema)+'</b>';
  h+='<h3>'+esc(x.titulo||nome)+'</h3>';
  if(x.resumo)h+='<p class="resumo">'+esc(x.resumo)+'</p>';
  if(!compacto){
    h+=concorrenciaLinhas(x.concorrencia);
    h+=uolLinha(x.uolDeu,x.uolUrl);
    if(x.apurar&&x.apurar.length)h+='<div class="rot">Correr atrás</div><ul class="apurar">'+x.apurar.map(function(a){return '<li>'+esc(a)+'</li>'}).join("")+'</ul>';
  }
  return h+'</div>';
}
function cardBalanco(a){
  var h='<div class="card">'+badgeVer(a.veredito);
  h+='<h3>'+esc(a.titulo)+'</h3>';
  if(a.resumo)h+='<p class="resumo">'+esc(a.resumo)+'</p>';
  h+=uolLinha(a.uolDeu,a.uolUrl);
  h+=concorrenciaLinhas(a.concorrentes);
  if(a.comentario)h+='<div class="coment">'+esc(a.comentario)+'</div>';
  return h+'</div>';
}

function montar(ed,te){
  var nav=document.getElementById("nav"),corpo=document.getElementById("corpo"),h="",secoes=[];
  if(ed){
    document.getElementById("quando").textContent="atualizado "+quandoBR(ed.geradoEm);
    document.getElementById("resumo").textContent=(ed.totalItens||0)+" matérias lidas ·";
    var ca=ed.correrAtras||{};
    document.getElementById("selo").textContent="Correr atrás · "+dataBR(ca.data)+(ca.parcial?" (até agora)":"")+" · Balanço de "+(ed.balanco&&ed.balanco.length?dataBR(ed.balanco[0].data):"—");

    // PARTE 2 — Correr atrás hoje (no topo, é o acionável)
    secoes.push(["correr","Correr atrás hoje"]);
    h+='<section id="correr"><h2 class="parte">Correr atrás — hoje'+(ca.parcial?' <span style="font-size:.7rem;color:var(--mt)">(parcial, até agora)</span>':'')+'</h2>';
    h+='<p class="psub">O que a concorrência publicou hoje e o UOL precisa perseguir. Um card por clube de prioridade, depois outros assuntos.</p>';
    (ca.clubes||[]).forEach(function(c){h+=cardCorrer(c,c.clube)});
    if(ca.outros&&ca.outros.length){h+='<div class="th">Outros assuntos</div>';ca.outros.forEach(function(o){h+=cardCorrer(o,o.tema)})}
    if(!(ca.clubes||[]).length)h+='<div class="aviso">Ainda sem leitura de hoje. Use "Rodar agora".</div>';
    h+='</section>';

    // PARTE 1 — Balanço de ontem (UOL x concorrência)
    secoes.push(["balanco","Balanço de ontem"]);
    h+='<section id="balanco"><h2 class="parte">Balanço — UOL × concorrência</h2>';
    h+='<p class="psub">O que saiu no dia fechado e como o UOL se saiu frente aos concorrentes.</p>';
    (ed.balanco||[]).forEach(function(b,idx){
      if((ed.balanco||[]).length>1)h+='<div class="diahead">'+esc(diaSemana(b.data))+' · '+esc(dataBR(b.data))+'</div>';
      if(b.placar)h+='<div class="placar"><b>Placar do dia:</b> '+esc(b.placar)+'</div>';
      (b.assuntos||[]).forEach(function(a){h+=cardBalanco(a)});
      if(!(b.assuntos||[]).length)h+='<p class="resumo">Dia fraco: nada forte neste dia.</p>';
    });
    if(!(ed.balanco||[]).length)h+='<p class="resumo">Sem balanço nesta rodada.</p>';
    h+='</section>';
  }else{
    h+='<section><div class="aviso">A leitura ainda não foi gerada. Veja o que está em alta agora, abaixo, ou use "Rodar agora".</div></section>';
  }

  if(te&&te.trends){
    secoes.push(["agora","Em alta agora"]);
    h+='<section id="agora"><div class="th">Em alta agora · '+esc(quandoBR(te.geradoEm))+'</div>';
    [["4","últimas 4h"],["24","últimas 24h"]].forEach(function(par){
      var b=te.trends[par[0]]||{},its=b.itens||[];
      h+='<div style="color:var(--mt);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;margin:10px 0 6px">'+par[1]+'</div>';
      if((b.status&&b.status!=="ok"&&!its.length)){h+='<div class="resumo">'+esc(b.aviso||"não carregou")+'</div>';return}
      if(!its.length){h+='<div class="resumo">sem alta</div>';return}
      h+='<div class="live">'+its.slice(0,12).map(function(it){return '<span class="t">'+esc(it.termo)+(it.volume?' <span class="v">'+esc(it.volume)+'</span>':'')+'</span>'}).join("")+'</div>';
    });
    h+='</section>';
  }
  if(ed&&ed.fontesForaDoAlcance&&ed.fontesForaDoAlcance.length)
    h+='<p class="nota">Fora do alcance: '+ed.fontesForaDoAlcance.map(esc).join("; ")+'.</p>';

  nav.innerHTML=secoes.map(function(p){return '<a href="#'+p[0]+'">'+esc(p[1])+'</a>'}).join("")
    +'<a class="botao" href="https://github.com/condedoro-tech/central/actions/workflows/editorial.yml" target="_blank" rel="noopener" title="Abre o GitHub; em Run workflow rode para atualizar">Rodar agora ↗</a>';
  corpo.innerHTML=h;
}
document.getElementById("sair").addEventListener("click",function(){
  try{localStorage.removeItem("central-chave");sessionStorage.removeItem(KS)}catch(e){}location.reload();
});
})();
</script></body></html>
