function b64(u){var s="";new Uint8Array(u).forEach(function(c){s+=String.fromCharCode(c)});return btoa(s)}
function abrir(chave){return crypto.subtle.decrypt({name:"AES-GCM",iv:bin(IV)},chave,bin(DADOS)).then(function(p){
  var h=new TextDecoder().decode(p);document.open();document.write(h);document.close()})}
function importar(raw){return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"])}
function derivar(senha){var e=new TextEncoder();return crypto.subtle.importKey("raw",e.encode(senha),"PBKDF2",false,["deriveBits"]).then(function(m){
