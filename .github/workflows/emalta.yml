# "Em alta hoje" — rodada MANUAL (você dispara quando quiser).
# De manhã o "Em alta" já sai sozinho junto da leitura editorial (editorial.yml, ~9h). Este aqui serve para
# atualizar de novo na hora que você quiser (ex.: à tarde, quando algo esquentou). NÃO roda sozinho.
# Regrava emalta.json cifrado; as páginas (index.html e emalta.html) leem esse arquivo na hora de abrir.
# Usa o tendencias.json mais recente (o coletor roda de 2 em 2h) para o sinal de busca.
name: Em alta hoje (manual)

on:
  workflow_dispatch:
    inputs:
      sombra:
        description: "Deixe 1 para só calcular e imprimir o resumo (modo sombra, não publica)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: emalta
  cancel-in-progress: false

jobs:
  emalta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala a cifra e o SDK da Anthropic
        run: pip install --quiet anthropic cryptography

      - name: Em alta hoje (regrava emalta.json cifrado)
        working-directory: ferramentas
        env:
          CENTRAL_SENHA: ${{ secrets.CENTRAL_SENHA }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EM_ALTA_SOMBRA: ${{ inputs.sombra && '1' || '0' }}
        run: python emalta.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publica o arquivo cifrado
        if: ${{ !inputs.sombra }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f emalta.json
          if git diff --cached --quiet; then echo "Nada mudou"; exit 0; fi
          git commit -m "Em alta hoje (manual)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 10
          done
          exit 1
