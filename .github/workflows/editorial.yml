# Leitura editorial do dia (a "ronda") — rodada MANUAL (você dispara quando pedir).
# NÃO roda sozinho. Coleta larga + Claude escreve a análise. Grava editorial.json cifrado e, de brinde, o emalta.json.
# Precisa de dois segredos: CENTRAL_SENHA (chave da Central) e ANTHROPIC_API_KEY (conta da Anthropic).
name: Leitura editorial do dia

on:
  workflow_dispatch:
    inputs:
      teste:
        description: "Deixe 1 para só montar e imprimir o dossiê (sem IA, sem gravar, sem custo)"
        required: false
        default: ""
      janela:
        description: "ontem (padrão) ou hoje (até agora, parcial)"
        required: false
        default: "ontem"
      datas:
        description: "Datas específicas AAAA-MM-DD separadas por vírgula (ex.: 2026-11-07,2026-11-08). Vazio = usa a janela."
        required: false
        default: ""
      modelo:
        description: "Modelo do Claude para a análise. Vazio = haiku (barato, padrão). Teste: claude-sonnet-5-5."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: editorial
  cancel-in-progress: false

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala a cifra e o SDK da Anthropic
        run: pip install --quiet anthropic cryptography

      - name: Coleta de ontem, análise e grava cifrado
        working-directory: ferramentas
        env:
          CENTRAL_SENHA: ${{ secrets.CENTRAL_SENHA }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RONDA_DESTINOS: ${{ secrets.RONDA_DESTINOS }}
          RONDA_MODELO: ${{ inputs.modelo }}
        run: |
          if [ -n "${{ inputs.datas }}" ]; then
            python editor.py --datas=${{ inputs.datas }}
          elif [ -n "${{ inputs.teste }}" ]; then
            if [ "${{ inputs.janela }}" = "hoje" ]; then python editor.py --teste --hoje; else python editor.py --teste; fi
          elif [ "${{ inputs.janela }}" = "hoje" ]; then
            python editor.py --hoje
          else
            python editor.py
          fi

      - name: Em alta hoje (grava emalta.json cifrado)
        if: ${{ !inputs.teste }}
        continue-on-error: true
        working-directory: ferramentas
        env:
          CENTRAL_SENHA: ${{ secrets.CENTRAL_SENHA }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EM_ALTA_SOMBRA: "0"
        run: python emalta.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publica os arquivos cifrados
        if: ${{ !inputs.teste }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # editorial.json e emalta.json são cifra (mudam inteiros a cada rodada): não dá para "mesclar".
          # Guarda as versões novas e reconstrói o commit sempre em cima do origin mais recente.
          cp editorial.json "$RUNNER_TEMP/editorial.json.novo"
          [ -f emalta.json ] && cp emalta.json "$RUNNER_TEMP/emalta.json.novo" || true
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/editorial.json.novo" editorial.json
            [ -f "$RUNNER_TEMP/emalta.json.novo" ] && cp "$RUNNER_TEMP/emalta.json.novo" emalta.json || true
            git add -f editorial.json emalta.json
            if git diff --cached --quiet; then echo "Nada mudou"; exit 0; fi
            git commit -q -m "Leitura editorial do dia"
            git push origin main && exit 0
            echo "push falhou (origin mudou?), tentando de novo"
            sleep $((i*5))
          done
          exit 1
