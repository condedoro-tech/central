# Leitura editorial do dia (pedido do dono).
# Roda 1x/dia de manhã, quando "ontem" já fechou. Coleta larga + Claude escreve a análise. Grava editorial.json cifrado.
# Precisa de dois segredos: CENTRAL_SENHA (chave da Central) e ANTHROPIC_API_KEY (conta da Anthropic).
name: Leitura editorial do dia

on:
  schedule:
    - cron: "7 12 * * 1-5"   # 09h07 em Brasília, de segunda a sexta (na segunda, lê sex+sáb+dom)
  workflow_dispatch:
    inputs:
      teste:
        description: "Deixe 1 para só montar e imprimir o dossiê (sem IA, sem gravar, sem custo)"
        required: false
        default: ""
      janela:
        description: "ontem (padrão) ou hoje (até agora, parcial)"
        required: false
        default: "ontem"
      datas:
        description: "Datas específicas AAAA-MM-DD separadas por vírgula (ex.: 2026-11-07,2026-11-08). Vazio = usa a janela."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: editorial
  cancel-in-progress: false

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala a cifra e o SDK da Anthropic
        run: pip install --quiet anthropic cryptography

      - name: Coleta de ontem, análise e grava cifrado
        working-directory: ferramentas
        env:
          CENTRAL_SENHA: ${{ secrets.CENTRAL_SENHA }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ inputs.datas }}" ]; then
            python editor.py --datas=${{ inputs.datas }}
          elif [ -n "${{ inputs.teste }}" ]; then
            python editor.py --teste
          elif [ "${{ inputs.janela }}" = "hoje" ]; then
            python editor.py --hoje
          else
            python editor.py
          fi

      - name: Publica o arquivo cifrado
        if: ${{ !inputs.teste }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f editorial.json
          if git diff --cached --quiet; then echo "Nada mudou"; exit 0; fi
          git commit -m "Leitura editorial do dia"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 10
          done
          exit 1
